  <line x1="256" y1="248" x2="256" y2="338" stroke="#B68D40" stroke-width="18" stroke-linecap="round"/>
  <line x1="298" y1="268" x2="298" y2="338" stroke="#F7F5F0" stroke-width="16" stroke-linecap="round"/>
